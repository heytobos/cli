# Stages @tobos/cli on npm when a sync to main changes cli/package.json and its version isn't on
# npm yet (or by hand: Actions → Publish CLI → Run workflow). npm trusts this workflow
# by OIDC (trusted publishing), so there is no token, and only to stage: the version goes live
# once a maintainer approves it with 2FA (npmjs.com → @tobos/cli → Staged Packages, or
# `npm stage approve <id>`). Built here, from this repo's own commit, so npm can attest it
# (provenance). The server releases the version's commit once it is approved, and mails to ask.
name: Publish CLI

on:
  push:
    branches: [main]
    paths: [cli/package.json]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-cli

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Only from main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Publish from main, not $GITHUB_REF." >&2
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # A runner's cached Node 24 may bundle an npm older than 11.15, which can't stage.
      - run: npm i -g npm@^11.15.0 && npm --version
      # A change to cli/package.json that leaves the version stages nothing.
      - name: A version npm doesn't have yet
        id: version
        run: |
          VERSION=$(node -p "require('./cli/package.json').version")
          if npm view "@tobos/cli@$VERSION" version >/dev/null 2>&1; then
            echo "::notice::@tobos/cli $VERSION is on npm already: nothing to stage."
          else
            echo "Staging @tobos/cli $VERSION."
            echo "new=true" >>"$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new
        run: pnpm install --frozen-lockfile
      - if: steps.version.outputs.new
        run: pnpm check
      - if: steps.version.outputs.new
        run: pnpm build
      # pnpm packs, so workspace: versions are written out; npm stages, for trusted publishing.
      - if: steps.version.outputs.new
        run: pnpm pack --pack-destination "$RUNNER_TEMP"
        working-directory: cli
      - name: Installs and runs
        if: steps.version.outputs.new
        run: |
          npm i -g "$RUNNER_TEMP"/tobos-cli-*.tgz
          test "$(tobos version)" = "$(node -p "require('./cli/package.json').version")"
      - if: steps.version.outputs.new
        run: npm stage publish "$RUNNER_TEMP"/tobos-cli-*.tgz --access public --provenance
